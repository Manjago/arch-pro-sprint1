version: '3.3'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smarthome
    ports:
      - "5432:5432"
    networks:
      - smarthome-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d smarthome"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: kafka-local
    ports:
      - "9092:9092" 
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - smarthome-network
    restart: unless-stopped

  temperature-api:
    build:
      context: ./apps/temperature-api 
      dockerfile: Dockerfile
    container_name: temperature-api
    networks:
      - smarthome-network
    restart: unless-stopped

  device-management-service:
    build:
      context: ./apps/device-management-service 
      dockerfile: Dockerfile
    container_name: device-management-service
    ports:
      - "4567:4567"
    networks:
      - smarthome-network
    restart: unless-stopped

  telemetry-service: 
    build:
      context: ./apps/telemetry-service
      dockerfile: Dockerfile
    container_name: telemetry-service
    ports:
      - "7070:7070"
    networks:
      - smarthome-network
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka

  app: 
    build:
      context: ./apps/smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      - postgres
      - temperature-api
    command: ["/wait-for-it.sh", "postgres:5432", "--", "./smarthome"]    
    environment:
      - DATABASE_URL=postgres://user:${POSTGRES_PASSWORD}@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres-data:

networks:
  smarthome-network:
    driver: bridge
