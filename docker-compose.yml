version: '3.3'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smarthome
    ports:
      - "5432:5432"
    networks:
      - smarthome-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d smarthome"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  temperature-api:
    build:
      context: ./apps/temperature-api 
      dockerfile: Dockerfile
    container_name: temperature-api
    networks:
      - smarthome-network
    restart: unless-stopped

  app: 
    build:
      context: ./apps/smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      - postgres
      - temperature-api
    environment:
      - DATABASE_URL=postgres://user:${POSTGRES_PASSWORD}@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres-data:

networks:
  smarthome-network:
    driver: bridge
